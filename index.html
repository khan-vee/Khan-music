<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KHAN MUSIC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#07111f;color:#fff;min-height:100vh;padding-bottom:100px}
header{position:sticky;top:0;z-index:20;background:#0b1d35ee;border-bottom:1px solid #19385d;padding:14px 18px;backdrop-filter:blur(10px)}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:24px;font-weight:900;color:#fff}.logo span{color:#29a8ff}
button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.admin-btn{background:#168cff;color:#fff}.logout{background:#263b55;color:#fff}
main{max-width:1100px;margin:auto;padding:24px 16px}
.hero{background:linear-gradient(135deg,#0d2f55,#087fd1);border-radius:22px;padding:30px 22px;margin-bottom:20px}
.hero h1{font-size:36px;margin-bottom:8px}.hero p{color:#dcefff;line-height:1.5}
.search{margin:18px 0}.search input,.form input,.form select{width:100%;padding:13px;border:1px solid #294d70;border-radius:10px;background:#0b1d32;color:#fff;outline:none}
.cats{display:flex;gap:8px;overflow:auto;margin:14px 0 20px}.cat{background:#102943;color:#cde8ff;white-space:nowrap}.cat.active{background:#168cff;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:#0d2036;border:1px solid #193b5e;border-radius:16px;overflow:hidden}
.cover{width:100%;aspect-ratio:1/1;object-fit:cover;background:#122b45}
.cardbody{padding:13px}.title{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:#91b6d7;margin:5px 0 12px}
.actions{display:flex;gap:8px}.play{background:#168cff;color:#fff;flex:1}.download{background:#18324d;color:#fff}
.empty{text-align:center;color:#8eacc8;padding:40px 10px}
#player{position:fixed;bottom:0;left:0;right:0;background:#091a2d;border-top:1px solid #23476b;padding:10px 16px;z-index:30}
.playerin{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}.now{min-width:150px;overflow:hidden}.now b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.now small{color:#8eacc8}
audio{width:100%}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}
.box{width:100%;max-width:500px;background:#0b1d32;border:1px solid #285174;border-radius:18px;padding:20px}.box h2{margin-bottom:15px}
.form{display:grid;gap:12px}.form label{font-size:13px;color:#a9c9e5}.form input,.form select{margin-top:5px}
.primary{background:#168cff;color:#fff;width:100%}.close{background:#263b55;color:#fff;width:100%}
.msg{min-height:20px;font-size:13px;color:#ff8585}
.admin-panel{display:none;background:#0d2036;border:1px solid #193b5e;border-radius:18px;padding:18px;margin-bottom:22px}.admin-panel.show{display:block}
.admin-panel h2{margin-bottom:15px}.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#b7cee3}.check input{margin-top:3px}
.credit{text-align:center;color:#6688a7;font-size:12px;margin:25px 0}
@media(max-width:600px){.hero h1{font-size:28px}.playerin{display:block}.now{margin-bottom:6px}audio{height:38px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">KHAN <span>MUSIC</span></div>
    <button class="admin-btn" id="adminBtn">Admin</button>
  </div>
</header>

<main>
  <section class="hero">
    <h1>KHAN MUSIC</h1>
    <p>Listen, discover and download your favourite music.</p>
  </section>

  <section class="admin-panel" id="adminPanel">
    <h2>Upload Music</h2>
    <form class="form" id="uploadForm">
      <label>Song title
        <input id="songTitle" type="text" placeholder="Song title" required>
      </label>
      <label>Artist
        <input id="songArtist" type="text" placeholder="Artist name" required>
      </label>
      <label>Category (website only)
        <select id="songCategory">
          <option>Bongo Flava</option><option>Afrobeats</option><option>Hip Hop</option>
          <option>Gospel</option><option>Drill</option><option>Other</option>
        </select>
      </label>
      <label>Audio file
        <input id="audioFile" type="file" accept="audio/*" required>
      </label>
      <label>Cover image
        <input id="coverFile" type="file" accept="image/*">
      </label>
      <label class="check">
        <input id="rightsCheck" type="checkbox" required>
        <span>I confirm that I have the right/permission to upload this music.</span>
      </label>
      <button class="primary" id="uploadBtn" type="submit">Upload Music</button>
      <div class="msg" id="uploadMsg"></div>
      <button class="close" type="button" id="logoutBtn">Logout</button>
    </form>
  </section>

  <div class="search">
    <input id="search" type="search" placeholder="Search music or artist...">
  </div>
  <div class="cats" id="cats"></div>
  <section class="grid" id="songs"></section>
  <div class="credit">THIS WEBSITE CREATED BY VICTOR TARIMO (KHAN__VEE)</div>
</main>

<div class="modal" id="loginModal">
  <div class="box">
    <h2>Admin Login</h2>
    <form class="form" id="loginForm">
      <label>Email<input id="email" type="email" autocomplete="username" required></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" id="loginBtn" type="submit">Login</button>
      <div class="msg" id="loginMsg"></div>
      <button class="close" type="button" id="closeLogin">Cancel</button>
    </form>
  </div>
</div>

<div id="player">
  <div class="playerin">
    <div class="now"><b id="nowTitle">No song selected</b><small id="nowArtist">KHAN MUSIC</small></div>
    <audio id="audioPlayer" controls preload="none"></audio>
  </div>
</div>

<script>
"use strict";

const SUPABASE_URL = "https://eqbswcopodcxmwncrtqj.supabase.co";
const SUPABASE_KEY = "sb_publishable_iXUq-FU6G4hdcOBkW7GHpQ_3OPjPIGD";
const MUSIC_BUCKET = "music";
const COVER_BUCKET = "covers";

let db = null;
let allSongs = [];
let activeCategory = "All";

const $ = id => document.getElementById(id);

function setMsg(id, text, ok=false){
  const el = $(id);
  el.textContent = text;
  el.style.color = ok ? "#4dd9a3" : "#ff8585";
}

function escapeHTML(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function publicUrl(bucket, path){
  if(!db || !path) return "";
  return db.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}

async function init(){
  if(!window.supabase){
    setMsg("uploadMsg","Supabase library failed to load.");
    return;
  }

  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  db.auth.onAuthStateChange((_event, session) => {
    updateAdminUI(session);
  });

  const {data:{session}} = await db.auth.getSession();
  updateAdminUI(session);
  await loadSongs();
}

function updateAdminUI(session){
  $("adminBtn").textContent = session ? "Admin ✓" : "Admin";
  $("adminPanel").classList.toggle("show", !!session);
}

async function loadSongs(){
  const container = $("songs");
  container.innerHTML = '<div class="empty">Loading music...</div>';

  if(!db){
    container.innerHTML = '<div class="empty">Supabase is not connected.</div>';
    return;
  }

  const {data, error} = await db
    .from("songs")
    .select("id,title,artist,audio_path,cover_path,published,created_at")
    .eq("published", true)
    .order("created_at", {ascending:false});

  if(error){
    console.error(error);
    container.innerHTML = '<div class="empty">Could not load music.<br>'+escapeHTML(error.message)+'</div>';
    return;
  }

  // The current Supabase songs table has no category column.
  // Use "Other" in the website instead of asking Supabase for that column.
  allSongs = (data || []).map(song => ({
    ...song,
    category: song.category || "Other"
  }));
  render();
}

function render(){
  const q = $("search").value.trim().toLowerCase();
  const filtered = allSongs.filter(song => {
    const categoryOK = activeCategory === "All" || song.category === activeCategory;
    const text = (song.title+" "+song.artist+" "+song.category).toLowerCase();
    return categoryOK && text.includes(q);
  });

  if(!filtered.length){
    $("songs").innerHTML = '<div class="empty">No music found.</div>';
    return;
  }

  $("songs").innerHTML = filtered.map(song => {
    const cover = publicUrl(COVER_BUCKET, song.cover_path) ||
      "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect width="100%" height="100%" fill="#12304d"/><text x="50%" y="50%" fill="white" font-size="42" text-anchor="middle">KHAN MUSIC</text></svg>'
      );
    return `
      <article class="card">
        <img class="cover" src="${escapeHTML(cover)}" alt="">
        <div class="cardbody">
          <div class="title">${escapeHTML(song.title)}</div>
          <div class="artist">${escapeHTML(song.artist)}</div>
          <div class="actions">
            <button class="play" onclick="playSong(${Number(song.id)})">Play</button>
            <button class="download" onclick="downloadSong(${Number(song.id)})">Download</button>
          </div>
        </div>
      </article>`;
  }).join("");
}

function playSong(id){
  const song = allSongs.find(s => Number(s.id) === Number(id));
  if(!song) return;

  const url = publicUrl(MUSIC_BUCKET, song.audio_path);
  if(!url){
    alert("Audio file URL is not available.");
    return;
  }

  $("nowTitle").textContent = song.title;
  $("nowArtist").textContent = song.artist;
  $("audioPlayer").src = url;
  $("audioPlayer").play().catch(() => {});
}

async function downloadSong(id){
  const song = allSongs.find(s => Number(s.id) === Number(id));
  if(!song) return;

  const url = publicUrl(MUSIC_BUCKET, song.audio_path);
  if(!url){
    alert("Download URL is not available.");
    return;
  }

  const a = document.createElement("a");
  a.href = url;
  a.download = (song.title || "music") + ".mp3";
  a.target = "_blank";
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function signIn(){
  if(!db) return setMsg("loginMsg","Supabase is not connected.");

  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    setMsg("loginMsg","Enter email and password.");
    return;
  }

  $("loginBtn").disabled = true;
  setMsg("loginMsg","Signing in...", true);

  const {error} = await db.auth.signInWithPassword({email,password});

  $("loginBtn").disabled = false;

  if(error){
    setMsg("loginMsg",error.message);
    return;
  }

  $("loginModal").classList.remove("show");
  setMsg("loginMsg","",true);
}

async function logout(){
  if(!db) return;
  const {error} = await db.auth.signOut();
  if(error) alert(error.message);
}

async function uploadMusic(e){
  e.preventDefault();

  if(!db){
    setMsg("uploadMsg","Supabase is not connected.");
    return;
  }

  const {data:{session}} = await db.auth.getSession();
  if(!session){
    setMsg("uploadMsg","Please login as admin first.");
    return;
  }

  const title = $("songTitle").value.trim();
  const artist = $("songArtist").value.trim();
  const category = $("songCategory").value;
  const audioFile = $("audioFile").files[0];
  const coverFile = $("coverFile").files[0];

  if(!title || !artist || !audioFile || !$("rightsCheck").checked){
    setMsg("uploadMsg","Fill all required fields and confirm upload rights.");
    return;
  }

  const btn = $("uploadBtn");
  btn.disabled = true;
  btn.textContent = "Uploading...";
  setMsg("uploadMsg","Uploading audio...", true);

  const uploadId = crypto.randomUUID();
  const safeName = audioFile.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const audioPath = uploadId + "/" + safeName;
  let coverPath = null;

  try{
    const audioResult = await db.storage.from(MUSIC_BUCKET).upload(
      audioPath, audioFile,
      {contentType: audioFile.type || "audio/mpeg", upsert:false}
    );

    if(audioResult.error) throw new Error("Audio upload: " + audioResult.error.message);

    if(coverFile){
      setMsg("uploadMsg","Uploading cover...", true);
      const coverName = coverFile.name.replace(/[^a-zA-Z0-9._-]/g,"_");
      coverPath = uploadId + "/" + coverName;

      const coverResult = await db.storage.from(COVER_BUCKET).upload(
        coverPath, coverFile,
        {contentType: coverFile.type || "image/jpeg", upsert:false}
      );

      if(coverResult.error) throw new Error("Cover upload: " + coverResult.error.message);
    }

    setMsg("uploadMsg","Saving song...", true);

    // The current songs table has no category column.
    const {error:dbError} = await db.from("songs").insert({
      title:title,
      artist:artist,
      audio_path:audioPath,
      cover_path:coverPath,
      published:true
    });

    if(dbError) throw new Error("Database: " + dbError.message);

    setMsg("uploadMsg","Music uploaded successfully.", true);
    $("uploadForm").reset();
    await loadSongs();

  }catch(err){
    console.error(err);
    setMsg("uploadMsg", err.message || "Upload failed.");
  }finally{
    btn.disabled = false;
    btn.textContent = "Upload Music";
  }
}

$("adminBtn").addEventListener("click", () => {
  db.auth.getSession().then(({data:{session}}) => {
    if(session){
      $("adminPanel").classList.toggle("show");
    }else{
      $("loginModal").classList.add("show");
      $("email").focus();
    }
  });
});

$("closeLogin").addEventListener("click", () => {
  $("loginModal").classList.remove("show");
});

$("loginForm").addEventListener("submit", e => {
  e.preventDefault();
  signIn();
});

$("logoutBtn").addEventListener("click", logout);
$("uploadForm").addEventListener("submit", uploadMusic);
$("search").addEventListener("input", render);

init();
</script>
</body>
                                                         </html>
